name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests with Maven
        run: mvn -B clean test

      - name: Report result
        if: success()
        run: echo "CI SUCCESS - build and all tests passed"

      - name: Report failure
        if: failure()
        run: echo "CI FAILED - build or tests failed"
